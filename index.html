<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bo — Portfolio</title>
  <meta name="description" content="Bo Moldenhauer — product engineer. Interactive portfolio with a scroll-driven video hero." />
</head>
<body>
  <div class="grain"></div>

  <header class="site-header" data-header>
    <a class="brand" href="#hero">Bo.</a>
    <nav class="nav">
      <a href="#work">Work</a>
      <a href="#connect">Contact</a>
    </nav>
  </header>

  <main>
    <!-- HERO: fullscreen video, pinned + scrubbed while scrolling -->
    <section id="hero" class="hero" data-hero>
      <div class="hero-video-wrap" data-hero-video-wrap>
        <video
          class="hero-video"
          data-hero-video
          poster="/assets/poster/hero-poster.jpg"
          muted
          playsinline
          preload="auto"
        >
          <source src="/assets/video/intro.mp4" type="video/mp4" />
        </video>
        <div class="hero-video-fallback" data-hero-fallback aria-hidden="true"></div>
        <div class="hero-scrim"></div>
      </div>

      <div class="hero-content">
        <p class="eyebrow" data-hero-reveal>Product Designer &amp; Developer</p>
        <h1 class="hero-title">
          <span data-hero-reveal>I build interfaces</span>
          <span data-hero-reveal>people remember.</span>
        </h1>
        <button class="mute-toggle" data-fade data-mute-toggle aria-pressed="false" aria-label="Unmute intro video">
          <span data-mute-icon>🔇</span>
        </button>
      </div>

      <div class="scroll-cue" data-hero-reveal>
        <span>Scroll</span>
        <div class="scroll-cue-line"><i></i></div>
      </div>
    </section>

    <!-- WORK: React + Framer Motion showcase (src/showcase) -->
    <section id="work" class="section work section--flush">
      <div id="showcase-root"></div>
    </section>

    <!-- CONTACT & CONNECT: hand-reveal video into holographic action cards (src/connect) -->
    <section id="connect" class="section connect section--flush">
      <div id="connect-root"></div>
    </section>



  </main>

  <footer class="site-footer">
    <p>&copy; <span data-year></span> Bo. All rights reserved.</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
