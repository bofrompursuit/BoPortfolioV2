<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bo.">
  <defs>
    <!-- brushed silver plate: bright top-left falling to a deeper edge bottom-right -->
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="42%" stop-color="#eceef2" />
      <stop offset="72%" stop-color="#d5d9e0" />
      <stop offset="100%" stop-color="#b9bfc9" />
    </linearGradient>

    <!-- soft sheen so the plate reads as metal rather than flat paper -->
    <radialGradient id="sheen" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- inner edge darkening, keeps the square from looking pasted on -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#39404a" stop-opacity="0.18" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#plate)" />
  <rect width="512" height="512" fill="url(#sheen)" />
  <rect width="512" height="512" fill="url(#vignette)" />

  <!-- Embossed "Bo." — highlight above-left, shadow below-right, dark face on top -->
  <g font-family="Helvetica Neue, Helvetica, Liberation Sans, Arial, sans-serif"
     font-weight="700" font-size="212" letter-spacing="-6" text-anchor="middle">
    <text x="256" y="332" transform="translate(-2.5,-3)" fill="#ffffff" fill-opacity="0.9">Bo.</text>
    <text x="256" y="332" transform="translate(3,3.5)" fill="#767e8a" fill-opacity="0.55">Bo.</text>
    <text x="256" y="332" fill="#2f353d">Bo.</text>
  </g>
</svg>
